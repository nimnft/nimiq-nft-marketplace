<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#e9d5ff"/>
    </linearGradient>
    <linearGradient id="grad3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer hexagon -->
  <path d="M60 8 L108 34 L108 86 L60 112 L12 86 L12 34 Z" fill="url(#grad1)" opacity="0.9"/>
  
  <!-- Inner diamond shape -->
  <path d="M60 24 L92 60 L60 96 L28 60 Z" fill="none" stroke="url(#grad2)" stroke-width="2.5" opacity="0.6"/>
  
  <!-- Central abstract mark - three stacked chevrons representing blockchain layers -->
  <g filter="url(#glow)">
    <!-- Top chevron -->
    <path d="M60 32 L78 48 L60 56 L42 48 Z" fill="url(#grad2)" opacity="0.9"/>
    <!-- Middle chevron -->
    <path d="M60 48 L78 64 L60 72 L42 64 Z" fill="white" opacity="0.85"/>
    <!-- Bottom chevron -->
    <path d="M60 64 L78 80 L60 88 L42 80 Z" fill="url(#grad2)" opacity="0.7"/>
  </g>
  
  <!-- Corner accents -->
  <circle cx="60" cy="8" r="3" fill="#c084fc" opacity="0.8"/>
  <circle cx="108" cy="34" r="3" fill="#818cf8" opacity="0.6"/>
  <circle cx="108" cy="86" r="3" fill="#6366f1" opacity="0.6"/>
  <circle cx="60" cy="112" r="3" fill="#a855f7" opacity="0.8"/>
  <circle cx="12" cy="86" r="3" fill="#6366f1" opacity="0.6"/>
  <circle cx="12" cy="34" r="3" fill="#818cf8" opacity="0.6"/>
</svg>
